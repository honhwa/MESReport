<html>
<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <script>
        function oa_tool() {
            if (window.parent.oa_frame.cols == "0,10,*") {
                frameshow.src = "images/p_1.gif";
                oa_tree.title = "隱藏工具欄"
                window.parent.oa_frame.cols = "175,10,*";
            }
            else {
                frameshow.src = "images/p_2.gif";
                oa_tree.title = "顯示工具欄"
                window.parent.oa_frame.cols = "0,10,*";
            }
        }
    </script>
</head>
<body text="#000000" leftmargin="0" topmargin="0" marginwidth="0" marginheight="0">
    <table width="10" border="0" height="100%" cellpadding="0" cellspacing="0" align="left" ID="Table1">
        <tr align="center">
            <td bgcolor="#AEB3bf">
                <div id=oa_tree onclick="oa_tool();" title="隱藏工具欄">
                    <img id=frameshow src="images/p_1.gif" width="9" height="50">
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
