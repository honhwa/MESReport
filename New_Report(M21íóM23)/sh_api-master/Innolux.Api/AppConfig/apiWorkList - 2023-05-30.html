﻿<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script>
        var baseUrl = "http://10.119.9.147:8080/SQLAgent/";
        var method = "post";
        function getApiWorkList(query, listdb) {
            var surl = baseUrl + "ApiWork";
            var parms = "apiName=GetApiWorks&query=" + query

            if (listdb)
                parms += "&listdb=true";

            if (window.XMLHttpRequest)
                var oAjax = new XMLHttpRequest();
            else
                var oAjax = new ActiveXObject("Microsoft.XMLHTTP");

            if (method.toUpperCase() == "GET")
                surl += "?" + parms;

            oAjax.open(method, surl, true);
            oAjax.send(parms);
            oAjax.onreadystatechange = function () {
                if (oAjax.readyState == 4) {
                    if (oAjax.status == 200) {
                        if (listdb)
                            result.value = formatJsonString(oAjax.responseText);
                        else
                            listApiWorks(oAjax.responseText);
                    }
                    else
                        alert("FAIL\n" + oAjax.statusText + "\n" + oAjax.responseText);
                }
            };
            return false;
        };
        function execApiWork(apiName){
            var workInfo = allWorkInfo[apiName];
            var parms = "apiName=" + apiName;
            var fData = new FormData();

            fData.append("apiName", apiName);
            
            for (var name in workInfo.parameters) {
                var el = document.getElementById(workInfo.apiName + "." + name);
                parms += "&" + name + "=" + el.value;

                if (el.files) {
                    for (var i = 0; i < el.files.length; i++)
                        fData.append(name, el.files[i]);
                }
                else
                    fData.append(name, el.value);
            }
            var surl = baseUrl + "ApiWork";          

            if (window.XMLHttpRequest)
                var oAjax = new XMLHttpRequest();
            else
                var oAjax = new ActiveXObject("Microsoft.XMLHTTP");

            if (method.toUpperCase() == "GET")
                surl += "?" + parms;

            var isDownload = workInfo.description.toLowerCase().indexOf('download') > -1;
            if (isDownload) {
                oAjax.responseType = "blob";
            }

            oAjax.open(method, surl, true);
            oAjax.send(fData);
            oAjax.onreadystatechange = function () {
                if (oAjax.readyState == 4) {
                    if (oAjax.status == 200) {
                        if (!isDownload)
                            result.value = formatJsonString(oAjax.responseText);
                        else {
                            let fileName = "inputFileName"; 
                            if (oAjax.getResponseHeader("content-disposition")) {
                                let arr = oAjax.getResponseHeader("content-disposition").split(" ");
                                fileName = decodeURI(arr[arr.length - 1].replace("filename*=UTF-8''", ""));
                            }

                            var blob = new Blob([oAjax.response]);
                            let a = document.createElement("a");
                            a.style = "display: none";
                            document.body.appendChild(a);
                            let url = window.URL.createObjectURL(blob);
                            a.href = url;
                            a.download = fileName;
                            a.click();
                            window.URL.revokeObjectURL(url);

                            result.value = "donwload file OK, FileName=" + fileName;
                        }
                    }
                    else {
                        if (!isDownload)
                            alert("FAIL\n" + oAjax.statusText + "\n" + oAjax.responseText);
                        else
                            alert("FAIL\n" + oAjax.statusText);
                    }
                }
            };
        }
        function formatJsonString(str) {
            try {
                var obj = JSON.parse(str);
                if (typeof obj == "object") {
                    return JSON.stringify(obj, null, 2);
                }
            }
            catch (e) {
            }
            return str;
        }
        function toJson(str) {
            try {
                let o = JSON.parse(str);
                if (o.description)
                    return o;
                else
                    return str;
            }
            catch (e) {
                return str;
            }
        }

        function listApiWorks(json) {
            apiWorkList.innerHTML = "";
            allWorkInfo = {};
            checkedWorkInfo = {};
            apiJob.value = "";
            let obj = JSON.parse(json);
            bg = true;
            for (var i = 0; i < obj.length; i++)
                showApiWork(obj[i]);
        }

        var checkedWorkInfo = {};
        function checkApiWorks(apiName) {
            if (event.currentTarget.checked) {
                checkedWorkInfo[apiName] = event.currentTarget;
                setMultiWorkDevHidden(false);
            }
            else
                delete checkedWorkInfo[apiName];

            showMultiWorkAreaText();            
        }
        function showMultiWorkAreaText() {
            var list = [];
            for (let name in checkedWorkInfo) {
                let apiWork = allWorkInfo[name];
                let apiWorkParm = {};
                apiWorkParm.name = apiWork.apiName;
                apiWorkParm.apiName = apiWork.apiName;

                for (let par in apiWork.parameters) {
                    let parInfo = toJson(apiWork.parameters[par]);

                    if (typeof (parInfo) == "string") {
                        parInfo = { description: parInfo, defaultValue: '' };
                    }

                    let defValue = "";
                    if (parInfo.defaultValue)
                        defValue = parInfo.defaultValue;

                    apiWorkParm[par] = defValue;
                }
                list.push(apiWorkParm);
            }
            list.sort(function (a, b) {
                if (a.name.toLowerCase() > b.name.toLowerCase())
                    return 1;
                else
                    return -1;
            });
            apiJob.value = JSON.stringify(list, null, 2);
        }
        function clearCheckBox() {
            for (let name in checkedWorkInfo) {
                checkedWorkInfo[name].checked = false;
            }
            checkedWorkInfo = {};
            apiJob.value = "";
        }

        var bg = true;
        var allWorkInfo;
        function showApiWork(workInfo) {
            bg = !bg;
            allWorkInfo[workInfo.apiName] = workInfo;
            var elApiInfo = document.createElement("div");
            if (bg)
                elApiInfo.style.backgroundColor = "darkgrey";
            else
                elApiInfo.style.backgroundColor = "lightblue";

            var sInfoHtml = "<input type=\"checkbox\" id=\"chk_" + workInfo.apiName + "\" onclick=\"checkApiWorks('" + workInfo.apiName + "')\">" +
                "</><label for=\"chk_" + workInfo.apiName + "\"><em style=\"font-size:20px;font-weight:bold\">" + workInfo.apiName + "</em></label><br/>";
            sInfoHtml += "<table><tr>";
            sInfoHtml += "<td>類全名:<td>" + workInfo.className;
            sInfoHtml += "<tr>";
            sInfoHtml += "<td>描述:<td>" + workInfo.description;
            sInfoHtml += "</table>";

            sInfoHtml += "<em style=\"font-size:16px;font-weight:bold;color:darkblue\">參數</em><br/>";

            sInfoHtml += "<table border=1 style=\"border-collapse:collapse\"><tr><td>參數名<td>輸入<td>說明";
            for (var par in workInfo.parameters) {
                let parInfo = toJson(workInfo.parameters[par]);

                if (typeof (parInfo) == "string") {
                    parInfo = { description: parInfo, defaultValue: '', inputType: 'text' };
                    if (parInfo.description.indexOf('file') > -1)
                        parInfo.inputType = "file";
                }

                let defValue = "";
                if (parInfo.defaultValue)
                    defValue = parInfo.defaultValue;

                if (!parInfo.inputType)
                    parInfo.inputType = "text";

                sInfoHtml += "<tr><td>" + par + "<td><input type=\"" + parInfo.inputType + "\" id=\"" + workInfo.apiName + "." + par + "\" value=\"" + defValue + "\"><td>" + parInfo.description;
            }

            sInfoHtml += "</table>";
            sInfoHtml += "<input type='button' value='叫用' onclick=\"execApiWork('" + workInfo.apiName + "')\" />";
            sInfoHtml += "</br></br>";
            elApiInfo.innerHTML = sInfoHtml;
            apiWorkList.appendChild(elApiInfo);
        }

        function execApiWorkMulti(apiJob) {
            var parms = "apiJob=" + apiJob;
            var surl = baseUrl + "ApiWorkMulti";

            if (window.XMLHttpRequest)
                var oAjax = new XMLHttpRequest();
            else
                var oAjax = new ActiveXObject("Microsoft.XMLHTTP");

            if (method.toUpperCase() == "GET")
                surl += "?" + parms;

            var fData = new FormData();
            fData.append("apiJob", apiJob);

            oAjax.open(method, surl, true);
            oAjax.send(fData);
            oAjax.onreadystatechange = function () {
                if (oAjax.readyState == 4) {
                    if (oAjax.status == 200)
                        result.value = formatJsonString(oAjax.responseText);
                    else
                        alert("FAIL\n" + oAjax.statusText + "\n" + oAjax.responseText);
                }
            };
        }

        window.onresize = resize_;
        function resize_() {
            if (window.innerWidth > 700) {
                rightPanel.style.width = (window.innerWidth - 670) + "px";

            }

            if (window.outerHeight > 300) {
                let rect = divMultiWork.getBoundingClientRect();
                let resultHeight = window.innerHeight - rect.height - 40;
                if (resultHeight < 200)
                    resultHeight = 200;
                result.style.height = resultHeight + "px";
                apiJob.style.width = "98%";
            }            
        }
        function setMultiWorkDevHidden(value) {
            if (value == undefined)
                divMultiWork.hidden = !divMultiWork.hidden
            else
                divMultiWork.hidden = value;
            resize_();
        }
        function Change() {
      //根据id找到两个下拉框对象
      var target1 = document.getElementById("initials");
      //得到第一个下拉框的内容
      baseUrl = target1.options[target1.selectedIndex].value;
      //document.getElementById("jump").href = baseUrl+"AppConfig/sqlAgentTest.html";
    }
   
    function jump() {
      window.opener = baseUrl+"AppConfig/sqlAgentTest.html" ;
    }

    </script>
</head>
<body onload="resize_()">
    <div style="background-color: aqua; width: 650px">
        <em style="font-size:20px;font-weight:bold">SQLAgent/ApiWork</em>
        <br />
        apiName或className或描述<br />
        <a><select id="initials" onchange="Change()">
          <option value="http://10.119.9.147:8080/SQLAgent/">当前呼叫API地址：http://10.119.9.147:8080/</option>
          <option value="http://localhost:8000/SQLAgent/">当前呼叫API地址：http://localhost:8000/</option>
          <option value="http://ngbreportapi.cminl.oa/SQLAgent/">当前呼叫API地址：http://ngbreportapi.cminl.oa/</option>
        </select></a><br /><br />
        <table>
            <tr>
                <td>查找:</td>
                <td><input id="query" name="query" value="" /></td>
                <td><input type="button" value="Query" onclick="getApiWorkList(query.value)" /></td>
                <td></td>
                <td><input type="button" value="列出所有數據庫連線" onclick="getApiWorkList('',true)" /></td>
            </tr>
        </table>
        <input type="button" value="ShowMulti" style="position:absolute;left:575px;top:10px"
               onclick="setMultiWorkDevHidden()" />
        <input type="button" value="清除所有勾選" style="position:absolute;left:560px;top:60px"
               onclick="clearCheckBox()" />
        <hr />

    </div>

    <div id="apiWorkList" style="width:650px"></div>

    <div id="rightPanel" style="position:fixed;left:660px;top:0px;width:1000px">
        <div id="divMultiWork" hidden style="background-color:aquamarine">
            <em style="font-size:20px;font-weight:bold">SQLAgent/ApiWorkMulti</em>
            <br />
            <textarea id="apiJob" name="apiJob" style="width: 98%; height: 150px; resize: vertical" onmouseup="resize_()"></textarea><br />
            <input type="button" value="ApiWorkMulti" onclick="execApiWorkMulti(apiJob.value)" />
        </div>
        <div>
            result<br />
            <textarea id="result" name="result" style="width: 98%; resize: none "></textarea>
        </div>
    </div>
</body>
</html>
