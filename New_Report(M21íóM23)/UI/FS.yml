    #覆蓋site的設定
    - cp SiteConfig/.env.FS .env.production
    - docker build --network=bridge1 -f Dockerfile -t $img_web:$CI_COMMIT_TAG .

.fs-push:
  extends: .fs-var
  script:    
    - echo "fs push img to harbor"
    - echo 'account:'$fs_runner_account
    - echo 'password:'"$fs_runner_password"
    - echo "$fs_runner_password" | docker login -u $fs_runner_account --password-stdin fshabor01.cminl.oa
    #IMG打tag
    - docker tag $img_web:$CI_COMMIT_TAG fshabor01.cminl.oa/$project_name/$img_web:$CI_COMMIT_TAG
