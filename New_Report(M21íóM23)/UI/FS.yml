    # - if [ z"$img" == z ]; then
    - if [ $img == $new_img ]; then
    - echo "no img should delete"
    - elif [ $(docker images $img_web -q | wc -l) -le 2 ]; then
    - echo "img version less 2"
    - else
    - docker image rmi $(docker images $img_web -q | tail -n 1)
    - fi 

.fs-delete:
  extends: .fs-var
  script:
    - echo "10.189.127.76 fshabor01.cminl.oa fshabor01" >> /etc/hosts
    #harbor刪除IMG
    - echo "del img in harbor"
    - tag=($(curl -k -X GET -u $fs_runner_account:$fs_runner_password $harbor_url$project_name"/repositories/"$img_web"/artifacts?page=1&page_size=10&with_tag=true&with_label=false&with_scan_overview=false&with_signature=false&with_immutable_status=false" -H "accept:\ application/json" -H "X-Accept-Vulnerabilities:\ application/vnd.scanner.adapter.vuln.report.harbor+json; version=1.0" | jq -r '.[].tags[].name'))
    - del_img_web=$harbor_url$project_name"/repositories/"$img_web"/artifacts/"
    - echo "所有的img id如下："${tag[@]} 
    - echo "共有的img數量："${#tag[*]} 
    # - unset tag[0];
    # - if [ ${#tag[*]} -le 3 ]; then for ((i=0; i < 3; i++));do unset tag[$i];done ; else echo "img less 3"; fi
    - for ((i=0; i < 3; i++));do unset tag[$i];done ;
    - for var in ${tag[@]}; do curl -k -X DELETE -u $fs_runner_account:$fs_runner_password $del_img_web$var  -H "accept:\ application/json"; done;

.fs-k8s_deploy:
  extends: .fs-var
  script:
    - echo "WEB編輯yaml";
    - img_tag=($(curl -k -X GET -u $fs_runner_account:$fs_runner_password GET $harbor_url$project_name"/repositories/"$img_web"/artifacts?page=1&page_size=10&with_tag=true&with_label=false&with_scan_overview=false&with_signature=false&with_immutable_status=false" -H "accept:\ application/json" -H "X-Accept-Vulnerabilities:\ application/vnd.scanner.adapter.vuln.report.harbor+json; version=1.0" | jq -r '.[].tags[].name'))
    - img='fshabor01.cminl.oa/'$project_name'/'$img_web':'$img_tag
    - sed -i -e 's, harbor_img, '$img',g' web_FS.yaml
    - cat web_FS.yaml
    - echo "WEB刪除Deployment";
    - curl -k -X DELETE -H 'Authorization:bearer '$k8s_token $K8s_url'apis/apps/v1/namespaces/'$project_name'/deployments/'$deployment_name
    - echo "WEB建立Deployment";
    - curl -X POST -k -H 'Authorization:bearer '$k8s_token -H 'Content-Type:application/yaml' --data-binary @web_FS.yaml $K8s_url'apis/apps/v1/namespaces/'$project_name'/deployments'

.fs-test-build: 
  extends: .fs-var
  script:
    - echo "FS build Image $CI_COMMIT_TITLE"
    - printenv
    #覆蓋site的設定
    - cp SiteConfig/.env.FS.test .env.production
    - docker build --network=bridge1 -f Dockerfile -t $img_web:$CI_COMMIT_SHA .

.fs-test-push:
  extends: .fs-var
  script:
    - echo "deploy to IGIB server"
    # - cd IGIB-WEB
    - export IMAGETAG=$img_web:$CI_COMMIT_SHA
    - docker-compose down
    # - docker image rmi $(docker images -f "dangling=true" -q | head -n 2)
    - docker-compose up -d
    - img=$(docker images $img_web -q | tail -n 1)
    - echo "img:"$img
    - new_img=$(docker images $IMAGETAG -q)
    - echo "new_img:"$new_img
    # - if [ z"$img" == z ]; then
    - if [ $img == $new_img ]; then
    - echo "no img can delete"
    - elif [ $(docker images $img_web -q | wc -l) -le 2 ]; then
    - echo "img version less 5"
    - else
    - docker image rmi $(docker images $img_web -q | tail -n 1)
    - fi
