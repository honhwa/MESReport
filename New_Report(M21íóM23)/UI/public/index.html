<body>
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
  </noscript>
  <div id="app">
    <div id="loader-wrapper">
      <div id="loader"></div>
      <div class="loader-section section-left"></div>
      <div class="loader-section section-right"></div>
      <div class="load_title">正在加载系统,请耐心等待...
      </div>
    </div>
  </div>
  <script>
    //預設使用谷歌瀏灠器開啟
    //使用谷歌瀏灠器開啟
    function OpenBrowserWithChrome() {
      //debugger;
      var TransUrl = window.location.href
      //======= 開啟Chrome =======↓
      if (navigator.userAgent.indexOf("Chrome") == -1) {
        var ws = new ActiveXObject('WScript.Shell');
        var winChromePath = 'C:/Documents and Settings/All Users/Application Data/WinNexus/WPD/GoogleChrome/App/Chrome-bin/chrome.exe';
        var x86ChromePath = 'C:/Program Files/Google/Chrome/Application/chrome.exe';
        var x64ChromePath = 'C:/Program Files (x86)/Google/Chrome/Application/chrome.exe';
        var win10EdgePath = 'C:/Windows/SystemApps/Microsoft.MicrosoftEdge_8wekyb3d8bbwe'
        try {
          ws.Exec(winChromePath + ' ' + TransUrl);
          window.opener = null;
          window.open('', '_self');
          window.close();
        } catch (err) {
          try {
            ws.Exec(x86ChromePath + ' ' + TransUrl);
            window.opener = null;
            window.open('', '_self');
            window.close();
          } catch (err) {
            try {
              ws.Exec(win10EdgePath + ' ' + TransUrl);
              window.opener = null;
              window.open('', '_self');
              window.close();
            } catch (err) {
              try { 
                ws.Exec(x64ChromePath + ' ' + TransUrl);
                window.opener = null;
                window.open('', '_self');
                window.close();
              }
              catch (err) {
                if (confirm("IE瀏覽器不支持該系統, 請使用Chrome瀏覽器!按確定後將自動安裝/開啟Chrome瀏覽器, 或取消用IE開啟但可能無法順利顯示(安裝時有問題可參考首頁HelpDesk)")) {
                  location.href = 'winnexus://api/1/software/wdf?name=d6be696e2aac24b03d0d39c6e15b621d678fcbd5.wdf';
                }
              }
            }
          }
        }
      }
      //======= 開啟Chrome =======↑
    }
    OpenBrowserWithChrome();
  </script>
  <!-- built files will be auto injected -->
