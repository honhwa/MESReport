apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    location: fs
    user: xingzhong.xie
  name: fsreportapi
  namespace: 	fsreportapi
spec:
  replicas: 1
  selector:
    matchLabels:
      deploy: fsreportapi
  template:
    metadata:
      labels:
        deploy: fsreportapi
    spec:
      containers:
        - args: []
          command: []
          image: harbor_img
          name: fsreportapi
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          privileged: true
          resources:
            limits:
              cpu: 512m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 100Mi
      imagePullSecrets:
        - name: 'harbor-login'        
