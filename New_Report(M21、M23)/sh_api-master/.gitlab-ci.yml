ngb_build:
  stage: build_img
  extends: .ngb-build
  tags:
    - "docker-runner"
  # only:
    # - master
  rules:
    - if: $CI_COMMIT_TITLE == "master" && $CI_COMMIT_TAG =~ /^NGB_[1-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}$/
      when: always
      allow_failure: true
 


ngb_harbor_img:
  stage: img_push
  extends: .ngb-harbor_img
  tags:
    - "docker-runner"
  # only:
    # - master
  rules:
    - if: $CI_COMMIT_TITLE == "master" && $CI_COMMIT_TAG =~ /^NGB_[1-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}$/
      when: always
      allow_failure: true


ngb_harbor_del_img:
  stage: img_delete
  extends: .ngb-harbor_del_img
  image: selenium:fs20210513
  tags:
    - "docker-runner"
  # only:
    # - master  
  rules:
    - if: $CI_COMMIT_TITLE == "master" && $CI_COMMIT_TAG =~ /^NGB_[1-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}$/
      when: always
      allow_failure: true


ngbTest_build:
  stage: build_img
  extends: .ngbTest-build
  tags:
    - "docker-runner"
  # <<: *def_rule
  only:
    - master


ngbTest_harbor_img:
  stage: img_push
  extends: .ngbTest-harbor_img
  tags:
    - "docker-runner"
  #except:
  only:
    - master # 不執行


ngbTest_harbor_del_img:
