.ngbTest-harbor_img:
  extends: .ngb-var
  # stage: img_push
  # tags:
    # - "docker-runner"
  # #except:
  # only:
    # - master # 不執行
  script:
    - echo "NGB push img to harbor"
    - echo 'account:'$account
    - echo 'password:'"$password"
    - echo "$password" | docker login -u $account --password-stdin ngbhabor1.cminl.oa
    #IMG打tag
    # - docker tag $img_api:$CI_COMMIT_SHORT_SHA fshabor01.cminl.oa/$project_name/$img_api:$CI_COMMIT_SHORT_SHA
    - docker tag $img_api:$CI_COMMIT_SHORT_SHA ngbhabor1.cminl.oa/$project_name/$img_api:$CI_COMMIT_SHORT_SHA
    #IMG推送到harbor
    # - docker push fshabor01.cminl.oa/$project_name/$img_api:$CI_COMMIT_SHORT_SHA
    - docker push ngbhabor1.cminl.oa/$project_name/$img_api:$CI_COMMIT_SHORT_SHA
    #IMG取消tag
    # - docker rmi $img_api:$CI_COMMIT_SHORT_SHA fshabor01.cminl.oa/$project_name/$img_api:$CI_COMMIT_SHORT_SHA
    # - docker rmi $img_api:$CI_COMMIT_SHORT_SHA fshabor01.cminl.oa/$project_name/$img_api:$CI_COMMIT_SHORT_SHA
    # - docker rmi fshabor01.cminl.oa/$project_name/$img_api:$CI_COMMIT_SHORT_SHA
    - docker rmi ngbhabor1.cminl.oa/$project_name/$img_api:$CI_COMMIT_SHORT_SHA
    - echo docker logout ngbhabor1.cminl.oa
    #清除本地docker的repository
    - img=$(docker images $img_api -q | tail -n 1)
    - echo "img:"$img
    - new_img=$(docker images $img_api:$CI_COMMIT_REF_NAME -q)
    - echo "new_img:"$new_img
    # - if [ z"$img" == z ]; then
    - if [ $img == $new_img ]; then
    - echo "no img should delete"
    - elif [ $(docker images $img_api -q | wc -l) -le 2 ]; then
    - echo "img version less 2"
    - else
    - docker image rmi $(docker images $img_api -q | tail -n 1)
    - fi 


.ngbTest-harbor_del_img:
  extends: .ngb-var
  # stage: img_delete
  # image: selenium:fs20210513
  # tags:
    # - "docker-runner"
  # #except:
  # only:
    # - master
  script:    
    - echo "del img in harbor"
    - tag=($(curl -k -X GET -u $account:$password GET $harbor_url$project_name"/repositories/"$img_api"/artifacts?page=1&page_size=10&with_tag=true&with_label=false&with_scan_overview=false&with_signature=false&with_immutable_status=false" -H "accept:\ application/json" -H "X-Accept-Vulnerabilities:\ application/vnd.scanner.adapter.vuln.report.harbor+json; version=1.0" | jq -r '.[].tags[].name'))
    - del_img_web=$harbor_url$project_name"/repositories/"$img_api"/artifacts/"
    - echo "所有的img id如下："${tag[@]} 
    - echo "共有的img數量："${#tag[*]} 
    # - unset tag[0];
    # - if [ ${#tag[*]} -le 3 ]; then for ((i=0; i < 3; i++));do unset tag[$i];done ; else echo "img less 3"; fi
    - for ((i=0; i < 3; i++));do unset tag[$i];done ;
    - for var in ${tag[@]}; do curl -k -X DELETE -u $account:$password $del_img_web$var  -H "accept:\ application/json"; done;

