fs_test_build:
  stage: build_img
  extends: .fs-test-build
  tags:
    - "docker-runner2"
  only:
    - master

fs_test_push:
  stage: img_push
  extends: .fs-test-push
  tags:
    - "docker-runner2"
  only:
    - master

# fs_test_delete:
#   stage: img_test_delete
#   extends: .fs-test-delete
#   image: selenium:fs20210513
#   tags:
#     - "docker-runner2"
#   only:
#     - master


fs_build:
  stage: build_img
  extends: .fs-build
  tags:
    - "docker-runner2"
  rules:
    - if: $CI_COMMIT_TITLE == "master" && $CI_COMMIT_TAG =~ /^FS_[1-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}$/
      when: always  
      allow_failure: true

fs_push:
  stage: img_push
  extends: .fs-push
  tags:
    - "docker-runner2"
  rules:
    - if: $CI_COMMIT_TITLE == "master" && $CI_COMMIT_TAG =~ /^FS_[1-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}$/
      when: always
      allow_failure: true

fs_delete:
  stage: img_delete
  extends: .fs-delete
  image: selenium:fs20210513
  tags:
    - "docker-runner2"
  rules:
    - if: $CI_COMMIT_TITLE == "master" && $CI_COMMIT_TAG =~ /^FS_[1-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}$/
      when: always  
      allow_failure: true

fs-k8s_deploy:
  stage: k8s_token
  extends: .fs-k8s_deploy
  image: selenium:fs20210513
  tags:
    - "docker-runner2"
  rules:
    - if: $CI_COMMIT_TITLE == "master" && $CI_COMMIT_TAG =~ /^FS_[1-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}$/
      when: manual  
      allow_failure: true 

ngb_build:
  stage: build_img
  extends: .ngb-build
  tags:
    - "docker-runner2"
  rules:
    - if: $CI_COMMIT_TITLE == "NGB" && $CI_COMMIT_TAG =~ /^NGB_[1-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}$/
      changes:
       - src/pages/ReportPortal/NGB/*
      when: always
      allow_failure: true


ngb_push:
  stage: img_push
  extends: .ngb-push
  tags:
    - "docker-runner2"
  rules:
    - if: $CI_COMMIT_TITLE == "NGB" && $CI_COMMIT_TAG =~ /^NGB_[1-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}$/
      changes:
       - src/pages/ReportPortal/NGB/*
      when: always
      allow_failure: true

ngb_delete:
  stage: img_delete
  extends: .ngb-delete
  image: selenium:fs20210513
  tags:
    - "docker-runner2"
  rules:
    - if: $CI_COMMIT_TITLE == "NGB" && $CI_COMMIT_TAG =~ /^NGB_[1-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}$/
      changes:
       - src/pages/ReportPortal/NGB/*
      when: always
      allow_failure: true
      
tn_build:
  stage: build_img
  extends: .tn-build
  tags:
    - "docker-runner2"
  rules:
    - if: $CI_COMMIT_TITLE == "TN" && $CI_COMMIT_TAG =~ /^TN_[1-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}$/
      changes:
       - src/pages/ReportPortal/TN/*
      when: always
      allow_failure: true

tn_push:
  stage: img_push
  extends: .tn-push
  tags:
    - "docker-runner2"
  rules:
    - if: $CI_COMMIT_TITLE == "TN" && $CI_COMMIT_TAG =~ /^TN_[1-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}$/
      changes:
       - src/pages/ReportPortal/TN/*
      when: always
      allow_failure: true

tn_delete:
  stage: img_delete
  extends: .tn-delete
  image: selenium:fs20210513
  tags:
    - "docker-runner2"
  rules:
    - if: $CI_COMMIT_TITLE == "TN" && $CI_COMMIT_TAG =~ /^TN_[1-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}\.[0-9][0-9]{0,1}$/
      changes:
       - src/pages/ReportPortal/TN/*
      when: always
      allow_failure: true      
