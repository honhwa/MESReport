kind: Deployment
apiVersion: apps/v1
metadata:
  name: ui
  namespace: fsreport
  labels:
    location: fs
    user: nick76.chang
spec:
  replicas: 1
  selector:
    matchLabels:
      deploy: ui
  template:
    metadata:
      creationTimestamp: null
      labels:
        deploy: ui
    spec:
      containers:
        - name: ui
          image: harbor_img
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: vts
              containerPort: 9913
              protocol: TCP
          privileged: true
          resources:
            limits:
              cpu: 256m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 100Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: harbor-login
      schedulerName: default-scheduler
      tolerations:
        - key: com.docker.ucp.manager
          operator: Exists
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
